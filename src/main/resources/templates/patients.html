<!DOCTYPE html >
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title> Patients</title>
    <link rel="stylesheet"  type="text/css" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" >
</head>
<body>

<h3>La liste des patients </h3>
<div class="p-3 m-2">



    <div class="card">
        <div class="card-header"> Liste des Patients</div>
        <div class="card-body">
            <form>
                <label >Keyword</label>
                <input type="text" name="keyword" th:value="${keyword}">
                <button class="btn btn-outline-info">Search</button>
            </form>
            <table class="table">
                <thead>
                <tr>
                    <td>ID</td><td>Nom</td><td>Prenom</td><td>Date Naissance</td><td>Score</td><td>Malade</td>
                </tr>

                </thead>
                <tbody>
                <tr th:each="p:${pagepatients}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nom}"></td>
                    <td th:text="${p.prenom}"></td>
                    <td th:text="${p.dateNaissance}"></td>
                    <td th:text="${p.score}"></td>
                    <td th:text="${p.malade}"></td>
                    <td>
                        <a onclick=" return confirm('etes vous sure?')" class="btn btn-danger" th:href="@{deletepatient(id=${p.id},keyword=${keyword},page=${currentpage})}">Delete</a>
                    </td>

                </tr>
                </tbody>
            </table>
            <ul class="nav nav-pills">
                <li th:each="page,status:${pages}">
                    <a th:class="${status.Index==currentpage? 'btn btn-info m-1':'btn btn-outline-info m-1'}" th:href="@{/Index(page=${status.Index},size=${size},keyword=${keyword})}"
                    th:text="${status.Index +1}"></a>
                </li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
